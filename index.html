<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BOSSWATCH — Monster Respawn Tracker</title>
<style>
  :root {
    --bg-primary: #090d16;
    --bg-surface: #111827;
    --bg-surface-2: #1a2436;
    --border: rgba(148, 163, 184, 0.16);
    --text-primary: #f8fafc;
    --text-muted: #94a3b8;
    --accent: #38bdf8;
    --accent-2: #a855f7;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 20% 0%, #152238 0%, var(--bg-primary) 55%);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 24px 16px 64px;
  }

  .container {
    max-width: 1080px;
    margin: 0 auto;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brand-badge {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 18px;
    color: #070b12;
    box-shadow: 0 0 24px rgba(56, 189, 248, 0.28);
  }

  h1 {
    font-size: 1.5rem;
    letter-spacing: 0.04em;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 0.875rem;
  }

  .audio-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 10px;
    background: var(--bg-surface);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 12px;
  }

  button, select, input {
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg-surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 0.875rem;
  }

  button {
    cursor: pointer;
    font-weight: 600;
    transition: transform 0.1s ease, background 0.15s ease, border-color 0.15s ease;
  }

  button:hover {
    background: #24324b;
    border-color: rgba(148, 163, 184, 0.35);
  }

  button:active {
    transform: scale(0.98);
  }

  button.primary {
    background: linear-gradient(135deg, #0284c7, #7c3aed);
    border: none;
    color: #fff;
  }

  button.primary:hover {
    filter: brightness(1.08);
  }

  button.danger {
    background: rgba(239, 68, 68, 0.15);
    border-color: rgba(239, 68, 68, 0.4);
    color: #fca5a5;
  }

  button.danger:hover {
    background: rgba(239, 68, 68, 0.28);
  }

  button.success {
    background: rgba(34, 197, 94, 0.16);
    border-color: rgba(34, 197, 94, 0.4);
    color: #86efac;
  }

  .panel {
    background: rgba(17, 24, 39, 0.88);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 20px;
  }

  .panel-title {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }

  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .preset-btn {
    background: rgba(56, 189, 248, 0.09);
    border-color: rgba(56, 189, 248, 0.28);
    color: #bae6fd;
    font-size: 0.8rem;
    padding: 6px 10px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
    align-items: end;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .field label {
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .filter-btn.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent);
    color: #e0f2fe;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
    gap: 16px;
  }

  .card {
    background: var(--bg-surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .card.soon {
    border-color: rgba(245, 158, 11, 0.55);
    box-shadow: 0 0 20px rgba(245, 158, 11, 0.12);
  }

  .card.spawned {
    border-color: rgba(34, 197, 94, 0.75);
    box-shadow: 0 0 26px rgba(34, 197, 94, 0.22);
    animation: pulse-border 1.6s infinite;
  }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 18px rgba(34, 197, 94, 0.2); }
    50% { box-shadow: 0 0 32px rgba(34, 197, 94, 0.45); }
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }

  .monster-name {
    font-size: 1.1rem;
    font-weight: 700;
  }

  .monster-zone {
    font-size: 0.8rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .status-pill {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 4px 8px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .status-counting {
    background: rgba(56, 189, 248, 0.15);
    color: #7dd3fc;
  }

  .status-soon {
    background: rgba(245, 158, 11, 0.18);
    color: #fcd34d;
  }

  .status-spawned {
    background: rgba(34, 197, 94, 0.22);
    color: #86efac;
  }

  .countdown {
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: 0.04em;
  }

  .meta-row {
    display: flex;
    justify-content: space-between;
    font-size: 0.78rem;
    color: var(--text-muted);
  }

  .progress-track {
    height: 7px;
    background: rgba(148, 163, 184, 0.14);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    transition: width 0.25s linear;
  }

  .card.soon .progress-fill {
    background: linear-gradient(90deg, #f59e0b, #ef4444);
  }

  .card.spawned .progress-fill {
    background: var(--success);
    width: 100% !important;
  }

  .card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding-top: 4px;
  }

  .card-actions button {
    padding: 6px 10px;
    font-size: 0.78rem;
  }

  .banner-stack {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 360px;
  }

  .alert-banner {
    background: #0f172a;
    border: 1px solid rgba(34, 197, 94, 0.7);
    border-left: 5px solid var(--success);
    border-radius: 12px;
    padding: 14px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55);
  }

  .alert-banner-title {
    font-weight: 800;
    color: #86efac;
    margin-bottom: 4px;
  }

  .alert-banner-body {
    font-size: 0.85rem;
    color: var(--text-primary);
    margin-bottom: 10px;
  }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    background: rgba(17, 24, 39, 0.55);
    border: 1px dashed var(--border);
    border-radius: 14px;
  }

  .small-muted {
    font-size: 0.78rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
  <div class="banner-stack" id="alertBanners"></div>

  <div class="container">
    <header>
      <div class="brand">
        <div class="brand-badge">BW</div>
        <div>
          <h1>BOSSWATCH</h1>
          <div class="subtitle">Monster &amp; Boss Respawn Tracker with Audio &amp; Visual Alerts</div>
        </div>
      </div>

      <div class="audio-bar">
        <label class="small-muted" for="soundSelect">Alarm:</label>
        <select id="soundSelect">
          <option value="horn">Boss Horn</option>
          <option value="tactical">Tactical Alert</option>
          <option value="chime">Arcane Chime</option>
          <option value="retro">8-Bit Retro</option>
        </select>

        <label class="small-muted" for="volumeSlider">Vol</label>
        <input id="volumeSlider" type="range" min="0" max="1" step="0.05" value="0.6" style="width:76px;padding:0;" />

        <button id="muteBtn" type="button">Sound: ON</button>
        <button id="testSoundBtn" type="button">Test</button>
        <button id="notifyPermBtn" type="button">Desktop Alerts</button>
      </div>
    </header>

    <section class="panel">
      <div class="panel-title">
        <span>Add Monster / Boss Timer</span>
        <div class="presets">
          <button type="button" class="preset-btn" data-preset="Mini-Boss|Field|00:05:00">+ 5m Mini-Boss</button>
          <button type="button" class="preset-btn" data-preset="Elite Monster|Dungeon|00:15:00">+ 15m Elite</button>
          <button type="button" class="preset-btn" data-preset="Field Boss|Overworld|00:30:00">+ 30m Field Boss</button>
          <button type="button" class="preset-btn" data-preset="World Boss|Rift|02:00:00">+ 2h World Boss</button>
        </div>
      </div>

      <form id="addTimerForm" class="form-grid">
        <div class="field">
          <label for="monsterName">Monster / Boss Name</label>
          <input id="monsterName" type="text" placeholder="e.g. Abyssal Wyrm" required />
        </div>

        <div class="field">
          <label for="monsterZone">Zone / Channel</label>
          <input id="monsterZone" type="text" placeholder="e.g. Sunken Cavern CH1" />
        </div>

        <div class="field">
          <label for="respawnDuration">Respawn (HH:MM:SS)</label>
          <input id="respawnDuration" type="text" value="00:15:00" pattern="^\d{1,3}:[0-5]\d:[0-5]\d$" placeholder="00:15:00" required />
        </div>

        <div class="field">
          <label for="killedAgoMin">Killed X Mins Ago</label>
          <input id="killedAgoMin" type="number" min="0" step="0.5" value="0" />
        </div>

        <div class="field">
          <label style="visibility:hidden;">Add</label>
          <button type="submit" class="primary">Start Timer</button>
        </div>
      </form>
    </section>

    <div class="toolbar">
      <div class="filter-group">
        <button type="button" class="filter-btn active" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="counting">Counting</button>
        <button type="button" class="filter-btn" data-filter="soon">Under 1m</button>
        <button type="button" class="filter-btn" data-filter="spawned">Spawned</button>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <input id="searchInput" type="search" placeholder="Search monster or zone..." />
        <select id="sortSelect">
          <option value="soonest">Sort: Soonest Respawn</option>
          <option value="name">Sort: Name (A-Z)</option>
          <option value="duration">Sort: Respawn Duration</option>
        </select>
        <button type="button" class="danger" id="clearAllBtn">Clear All</button>
      </div>
    </div>

    <div id="timersGrid" class="grid"></div>
  </div>

  <script>
    const STORAGE_KEY = "bosswatch_timers_v1";
    const PREFS_KEY = "bosswatch_prefs_v1";

    let timers = [];
    let prefs = {
      sound: "horn",
      volume: 0.6,
      muted: false,
      filter: "all",
      search: "",
      sort: "soonest"
    };

    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === "suspended") {
        audioCtx.resume().catch(() => {});
      }
      return audioCtx;
    }

    function playAlarmSound(type = prefs.sound) {
      if (prefs.muted) return;
      const ctx = getAudioContext();
      if (!ctx) return;

      const now = ctx.currentTime;
      const vol = Math.max(0.01, Number(prefs.volume) || 0.5);

      const tone = (freq, startOffset, duration, wave = "sawtooth", peak = 0.25) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(freq, now + startOffset);
        gain.gain.setValueAtTime(0.0001, now + startOffset);
        gain.gain.exponentialRampToValueAtTime(vol * peak, now + startOffset + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + startOffset + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now + startOffset);
        osc.stop(now + startOffset + duration + 0.03);
      };

      if (type === "horn") {
        tone(146.83, 0, 0.55, "sawtooth", 0.35);
        tone(220.0, 0.05, 0.55, "triangle", 0.25);
        tone(146.83, 0.65, 0.7, "sawtooth", 0.38);
      } else if (type === "tactical") {
        tone(880, 0, 0.14, "square", 0.2);
        tone(1174.66, 0.18, 0.14, "square", 0.2);
        tone(880, 0.36, 0.14, "square", 0.2);
        tone(1174.66, 0.54, 0.22, "square", 0.22);
      } else if (type === "chime") {
        tone(523.25, 0, 0.45, "sine", 0.3);
        tone(659.25, 0.14, 0.45, "sine", 0.3);
        tone(783.99, 0.28, 0.55, "sine", 0.3);
        tone(1046.5, 0.42, 0.75, "sine", 0.32);
      } else if (type === "retro") {
        tone(440, 0, 0.12, "square", 0.2);
        tone(554.37, 0.12, 0.12, "square", 0.2);
        tone(659.25, 0.24, 0.12, "square", 0.2);
        tone(880, 0.36, 0.3, "square", 0.22);
      }
    }

    function parseDurationToSeconds(str) {
      const parts = String(str || "").trim().split(":").map(Number);
      if (parts.length !== 3 || parts.some(n => Number.isNaN(n) || n < 0)) return null;
      const [h, m, s] = parts;
      if (m >= 60 || s >= 60) return null;
      return h * 3600 + m * 60 + s;
    }

    function formatHMS(totalSeconds) {
      const clamped = Math.max(0, Math.floor(totalSeconds));
      const h = Math.floor(clamped / 3600);
      const m = Math.floor((clamped % 3600) / 60);
      const s = clamped % 60;
      return [h, m, s].map(n => String(n).padStart(2, "0")).join(":");
    }

    function formatClockTime(epochMs) {
      return new Date(epochMs).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(timers));
      localStorage.setItem(PREFS_KEY, JSON.stringify(prefs));
    }

    function loadState() {
      try {
        const savedTimers = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
        if (Array.isArray(savedTimers)) {
          timers = savedTimers;
        }
      } catch {}

      try {
        const savedPrefs = JSON.parse(localStorage.getItem(PREFS_KEY) || "null");
        if (savedPrefs && typeof savedPrefs === "object") {
          prefs = { ...prefs, ...savedPrefs };
        }
      } catch {}
    }

    function addTimer(name, zone, durationSec, killedAgoSec = 0) {
      const now = Date.now();
      const killedAt = now - killedAgoSec * 1000;
      const respawnAt = killedAt + durationSec * 1000;

      timers.push({
        id: crypto.randomUUID ? crypto.randomUUID() : String(now + Math.random()),
        name: name.trim(),
        zone: (zone || "").trim() || "General Zone",
        durationSec,
        killedAt,
        respawnAt,
        alertedSpawn: false,
        alertedWarning: false
      });

      saveState();
      renderTimers();
    }

    function resetTimerKilledNow(id) {
      const t = timers.find(item => item.id === id);
      if (!t) return;
      const now = Date.now();
      t.killedAt = now;
      t.respawnAt = now + t.durationSec * 1000;
      t.alertedSpawn = false;
      t.alertedWarning = false;
      saveState();
      renderTimers();
    }

    function adjustRespawn(id, deltaSec) {
      const t = timers.find(item => item.id === id);
      if (!t) return;
      t.respawnAt += deltaSec * 1000;
      if (t.respawnAt > Date.now()) {
        t.alertedSpawn = false;
      }
      saveState();
      renderTimers();
    }

    function deleteTimer(id) {
      timers = timers.filter(item => item.id !== id);
      saveState();
      renderTimers();
    }

    function showAlertBanner(timer) {
      const stack = document.getElementById("alertBanners");
      const banner = document.createElement("div");
      banner.className = "alert-banner";
      banner.innerHTML = `
        <div class="alert-banner-title">MONSTER RESPAWNED</div>
        <div class="alert-banner-body"><strong>${escapeHtml(timer.name)}</strong> (${escapeHtml(timer.zone)}) is now up!</div>
        <div style="display:flex;gap:8px;">
          <button type="button" class="success" data-reset-id="${timer.id}">Killed Now</button>
          <button type="button" data-dismiss="true">Dismiss</button>
        </div>
      `;

      banner.querySelector('[data-dismiss="true"]').addEventListener("click", () => banner.remove());
      const resetBtn = banner.querySelector("[data-reset-id]");
      if (resetBtn) {
        resetBtn.addEventListener("click", () => {
          resetTimerKilledNow(resetBtn.getAttribute("data-reset-id"));
          banner.remove();
        });
      }

      stack.prepend(banner);
    }

    function sendDesktopNotification(timer) {
      if (!("Notification" in window)) return;
      if (Notification.permission === "granted") {
        new Notification(`${timer.name} Respawned!`, {
          body: `Zone: ${timer.zone} — Ready now.`
        });
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function getTimerStatus(timer, now = Date.now()) {
      const remSec = Math.floor((timer.respawnAt - now) / 1000);
      if (remSec <= 0) return { code: "spawned", label: "Spawned", remSec: 0 };
      if (remSec <= 60) return { code: "soon", label: "< 1 Min", remSec };
      return { code: "counting", label: "Tracking", remSec };
    }

    function renderTimers() {
      const grid = document.getElementById("timersGrid");
      const now = Date.now();

      let filtered = timers.filter(t => {
        const status = getTimerStatus(t, now);
        if (prefs.filter !== "all" && status.code !== prefs.filter) return false;
        if (prefs.search) {
          const q = prefs.search.toLowerCase();
          const matchName = t.name.toLowerCase().includes(q);
          const matchZone = t.zone.toLowerCase().includes(q);
          if (!matchName && !matchZone) return false;
        }
        return true;
      });

      filtered.sort((a, b) => {
        if (prefs.sort === "name") return a.name.localeCompare(b.name);
        if (prefs.sort === "duration") return a.durationSec - b.durationSec;
        return a.respawnAt - b.respawnAt;
      });

      if (!filtered.length) {
        grid.innerHTML = `<div class="empty-state">No respawn timers match your current view. Add a monster above or click a preset.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(t => {
        const status = getTimerStatus(t, now);
        const totalMs = Math.max(1000, t.respawnAt - t.killedAt);
        const elapsedMs = Math.min(totalMs, Math.max(0, now - t.killedAt));
        const pct = Math.min(100, Math.max(0, (elapsedMs / totalMs) * 100));

        return `
          <article class="card ${status.code}" data-id="${t.id}">
            <div class="card-top">
              <div>
                <div class="monster-name">${escapeHtml(t.name)}</div>
                <div class="monster-zone">${escapeHtml(t.zone)} • CD ${formatHMS(t.durationSec)}</div>
              </div>
              <span class="status-pill status-${status.code}">${status.label}</span>
            </div>

            <div class="countdown">${status.code === "spawned" ? "00:00:00" : formatHMS(status.remSec)}</div>

            <div class="progress-track">
              <div class="progress-fill" style="width:${pct.toFixed(1)}%"></div>
            </div>

            <div class="meta-row">
              <span>Spawn Time: <strong>${formatClockTime(t.respawnAt)}</strong></span>
              <span>${status.code === "spawned" ? "Target is up!" : "Respawns at local time"}</span>
            </div>

            <div class="card-actions">
              <button type="button" class="success" data-action="reset" data-id="${t.id}">Killed Now</button>
              <button type="button" data-action="minus1m" data-id="${t.id}">-1m</button>
              <button type="button" data-action="plus1m" data-id="${t.id}">+1m</button>
              <button type="button" class="danger" data-action="delete" data-id="${t.id}">Remove</button>
            </div>
          </article>
        `;
      }).join("");
    }

    function tick() {
      const now = Date.now();
      let triggeredAny = false;

      for (const t of timers) {
        const remMs = t.respawnAt - now;
        if (!t.alertedWarning && remMs > 0 && remMs <= 60000) {
          t.alertedWarning = true;
          triggeredAny = true;
        }
        if (!t.alertedSpawn && remMs <= 0) {
          t.alertedSpawn = true;
          triggeredAny = true;
          playAlarmSound(prefs.sound);
          showAlertBanner(t);
          sendDesktopNotification(t);
        }
      }

      if (triggeredAny) {
        saveState();
      }
      renderTimers();
    }

    // Event wiring
    document.getElementById("addTimerForm").addEventListener("submit", e => {
      e.preventDefault();
      getAudioContext();
      const name = document.getElementById("monsterName").value;
      const zone = document.getElementById("monsterZone").value;
      const durStr = document.getElementById("respawnDuration").value;
      const killedAgoMin = parseFloat(document.getElementById("killedAgoMin").value || "0");

      const durSec = parseDurationToSeconds(durStr);
      if (!durSec || durSec <= 0) {
        alert("Please enter a valid duration in HH:MM:SS format (e.g., 00:15:00).");
        return;
      }

      addTimer(name, zone, durSec, Math.max(0, killedAgoMin) * 60);
      document.getElementById("monsterName").value = "";
      document.getElementById("killedAgoMin").value = "0";
    });

    document.querySelectorAll(".preset-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        getAudioContext();
        const [name, zone, dur] = btn.getAttribute("data-preset").split("|");
        const sec = parseDurationToSeconds(dur);
        if (sec) addTimer(name, zone, sec, 0);
      });
    });

    document.getElementById("timersGrid").addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      getAudioContext();
      const id = btn.getAttribute("data-id");
      const action = btn.getAttribute("data-action");
      if (action === "reset") resetTimerKilledNow(id);
      else if (action === "minus1m") adjustRespawn(id, -60);
      else if (action === "plus1m") adjustRespawn(id, 60);
      else if (action === "delete") deleteTimer(id);
    });

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        prefs.filter = btn.getAttribute("data-filter");
        saveState();
        renderTimers();
      });
    });

    document.getElementById("searchInput").addEventListener("input", e => {
      prefs.search = e.target.value;
      saveState();
      renderTimers();
    });

    document.getElementById("sortSelect").addEventListener("change", e => {
      prefs.sort = e.target.value;
      saveState();
      renderTimers();
    });

    document.getElementById("clearAllBtn").addEventListener("click", () => {
      if (!timers.length) return;
      if (confirm("Remove all respawn timers?")) {
        timers = [];
        saveState();
        renderTimers();
      }
    });

    const soundSelect = document.getElementById("soundSelect");
    const volumeSlider = document.getElementById("volumeSlider");
    const muteBtn = document.getElementById("muteBtn");

    soundSelect.addEventListener("change", () => {
      prefs.sound = soundSelect.value;
      saveState();
    });

    volumeSlider.addEventListener("input", () => {
      prefs.volume = parseFloat(volumeSlider.value);
      saveState();
    });

    muteBtn.addEventListener("click", () => {
      prefs.muted = !prefs.muted;
      muteBtn.textContent = prefs.muted ? "Sound: MUTED" : "Sound: ON";
      saveState();
    });

    document.getElementById("testSoundBtn").addEventListener("click", () => {
      const wasMuted = prefs.muted;
      prefs.muted = false;
      playAlarmSound(prefs.sound);
      prefs.muted = wasMuted;
    });

    document.getElementById("notifyPermBtn").addEventListener("click", async () => {
      if (!("Notification" in window)) {
        alert("Desktop notifications are not supported in this browser.");
        return;
      }
      const perm = await Notification.requestPermission();
      alert(`Notification permission: ${perm}`);
    });

    // Init
    loadState();
    soundSelect.value = prefs.sound;
    volumeSlider.value = prefs.volume;
    muteBtn.textContent = prefs.muted ? "Sound: MUTED" : "Sound: ON";
    document.getElementById("sortSelect").value = prefs.sort;
    document.getElementById("searchInput").value = prefs.search;
    document.querySelectorAll(".filter-btn").forEach(b => {
      b.classList.toggle("active", b.getAttribute("data-filter") === prefs.filter);
    });

    if (!timers.length) {
      addTimer("Ancient Drake", "Volcanic Caldera CH2", 900, 120);
      addTimer("Shadow Warden", "Crypt of Ash", 1800, 0);
    }

    tick();
    setInterval(tick, 500);
  </script>
</body>
</html>
